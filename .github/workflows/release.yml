name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test compact APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleCompact testDebugUnitTest --no-configuration-cache --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "v${version}" = "${GITHUB_REF_NAME}"
          mkdir -p dist
          apk="dist/MoQPublisher-${version}-compact.apk"
          cp app/build/outputs/apk/compact/app-compact.apk "$apk"
          sha256sum "$apk" | awk '{print $1}' > "${apk}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
